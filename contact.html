<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact - Puja Gongal Shrestha</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
      background: url('mountain.webp') no-repeat center center fixed;
      background-size: cover;
      height: 100%;
      color: white;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      z-index: 1;
    }

    .navbar {
      background-color: rgba(0, 0, 0, 0.7);
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 100;
      text-align: center;
      padding: 10px 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }

    .navbar a {
      color: white;
      padding: 10px 14px;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
      white-space: nowrap;
    }

    .navbar a:hover {
      background-color: #ddd;
      color: black;
      border-radius: 5px;
    }

    .container {
      padding: 120px 20px 40px;
      max-width: 1000px;
      margin: auto;
      position: relative;
      z-index: 2;
    }

    .contact-section {
      background-color: rgba(0, 0, 0, 0.5);
      padding: 20px;
      border-radius: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      align-items: flex-start;
    }

    .form-section {
      flex: 1 1 60%;
    }

    .form-section h1 {
      font-size: 36px;
      margin-bottom: 15px;
    }

    .form-section p {
      font-size: 17px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .contact-form input,
    .contact-form textarea {
      padding: 10px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      width: 100%;
    }

    .contact-form input[type="submit"] {
      background-color: #00A2FF;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .contact-form input[type="submit"]:hover {
      background-color: #007ACC;
    }

    .contact-image {
      flex: 1 1 35%;
      max-width: 300px;
      width: 100%;
      height: auto;
      border-radius: 10px;
      align-self: center;
    }

    .icon-section {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 100;
      display: flex;
      align-items: center;
    }

    .icon-section img {
      width: 45px;
      height: 45px;
      margin-left: 10px;
      cursor: pointer;
      transition: transform 0.3s ease;
      border-radius: 50%;
    }

    .icon-section img:hover {
      transform: scale(1.1);
    }

    .contact-me-text {
      font-size: 18px;
      font-weight: bold;
      color: white;
      position: fixed;
      bottom: 30px;
      right: 130px;
      z-index: 101;
      display: flex;
      align-items: center;
      animation: fadeInOut 3s infinite;
    }

    .arrow {
      margin-right: 5px;
      display: inline-block;
      transform: rotate(45deg);
      border: solid white;
      border-width: 0 3px 3px 0;
      padding: 3px;
      animation: fadeInOut 3s infinite;
    }

    .arrow:first-child {
      margin-right: 2px;
    }

    @keyframes fadeInOut {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }

    /* Mobile Responsive Design */
    @media screen and (max-width: 768px) {
      .navbar {
        flex-direction: column;
      }

      .navbar a {
        font-size: 14px;
        padding: 10px;
      }

      .container {
        padding: 120px 15px 40px;
      }

      .contact-section {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .form-section h1 {
        font-size: 28px;
      }

      .form-section p {
        font-size: 16px;
      }

      .contact-image {
        margin-top: 20px;
        max-width: 90%;
      }

      .contact-me-text {
        font-size: 16px;
        right: 80px;
      }

      .icon-section {
        bottom: 15px;
        right: 15px;
      }

      .icon-section img {
        width: 40px;
        height: 40px;
      }
    }
  </style>

  <script>
    function sendMail() {
      var name = document.getElementsByName('name')[0].value;
      var email = document.getElementsByName('email')[0].value;
      var message = document.getElementsByName('message')[0].value;

      var mailtoLink = "mailto:pgongalshrestha@gmail.com" +
        "?subject=New message from " + encodeURIComponent(name) +
        "&body=" + encodeURIComponent("From: " + email + "\n\nMessage: " + message);

      window.location.href = mailtoLink;
    }
  </script>
</head>
<body>

  <div class="overlay"></div>

  <!-- Navbar -->
  <div class="navbar">
    <a href="index.html">Home</a>
    <a href="about.html">About Me</a>
    <a href="experience.html">Experience</a>
    <a href="projects.html">Social Projects & Events</a>
    <a href="contact.html">Contact</a>
  </div>

  <!-- Main Content -->
  <div class="container">
    <div class="contact-section">
      <div class="form-section">
        <h1>Let's connect</h1>
        <p>If you would like to get in touch, feel free to send me a message below.</p>
        <form class="contact-form" onsubmit="sendMail(); return false;">
          <input type="text" name="name" placeholder="Your Name" required>
          <input type="email" name="email" placeholder="Your Email" required>
          <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
          <input type="submit" value="Send Message">
        </form>
      </div>
      <img src="contactme.webp" alt="Contact Me" class="contact-image">
    </div>
  </div>

  <!-- Animated CTA -->
  <div class="contact-me-text">
    <div class="arrow"></div>
    <div class="arrow"></div>
    Contact Me >>
  </div>

  <!-- Social Icons -->
  <div class="icon-section">
    <a href="mailto:pgongalshrestha@gmail.com">
      <img src="gmail.jpg" alt="Gmail">
    </a>
    <a href="https://www.linkedin.com/in/puja-gongal-shrestha-1b4a9a19a" target="_blank">
      <img src="linkedIn-logo.png" alt="LinkedIn">
    </a>
  </div>

</body>
</html>
